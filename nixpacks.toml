[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x", "openssl", "chromium"]

[phases.install]
# cacheDirectories intentionally empty: Railway's persisted node_modules
# cache mount corrupted (buildkit "cannot replace directory ... with file",
# 5 failed builds 2026-07-22). Installing without the mount trades ~1 min of
# build time for deterministic builds.
cacheDirectories = []
cmds = ["npm install --force"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
