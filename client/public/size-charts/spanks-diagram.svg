<!-- viewBox is cropped to the drawing rather than the full 1080x1260 canvas: the page
     gives this a 280px column, and the empty margin was rendering the labels too small. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="132 312 896 782" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="132" y="312" width="896" height="782" fill="#ffffff"/>

  <!-- Garment: spanks laid flat, front view. Short gripper leg. -->
  <path d="M 340,340 L 740,340
           C 760,420 764,480 758,560
           C 756,660 754,762 752,852
           L 578,862
           C 566,802 552,772 540,748
           C 528,772 514,802 502,862
           L 328,852
           C 326,762 324,660 322,560
           C 316,480 320,420 340,340 Z"
        fill="#f4f4f5" stroke="#18181b" stroke-width="4" stroke-linejoin="round"/>

  <!-- Waistband -->
  <line x1="326" y1="398" x2="754" y2="398" stroke="#18181b" stroke-width="3"/>
  <line x1="330" y1="369" x2="750" y2="369" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="7 7"/>

  <!-- Silicone leg grippers -->
  <line x1="332" y1="822" x2="498" y2="832" stroke="#a1a1aa" stroke-width="3" stroke-dasharray="7 7"/>
  <line x1="582" y1="832" x2="748" y2="822" stroke="#a1a1aa" stroke-width="3" stroke-dasharray="7 7"/>

  <!-- 18cm drop from the waist to the hip line -->
  <line x1="262" y1="345" x2="262" y2="556" stroke="#2563eb" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="255" y1="345" x2="330" y2="345" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="255" y1="558" x2="322" y2="558" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="152" y="462" font-size="30" font-weight="700" fill="#2563eb">18cm</text>

  <!-- A. Half hip, measured flat across the garment on that line -->
  <line x1="322" y1="560" x2="758" y2="560" stroke="#2563eb" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="430" y="532" font-size="34" font-weight="700" fill="#2563eb">A. ½ Hip</text>

  <!-- B. Total length down the side seam -->
  <line x1="862" y1="342" x2="862" y2="854" stroke="#2563eb" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="744" y1="342" x2="870" y2="342" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="752" y1="854" x2="870" y2="854" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="886" y="586" font-size="34" font-weight="700" fill="#2563eb">B. Total</text>
  <text x="886" y="626" font-size="34" font-weight="700" fill="#2563eb">Length</text>
  <text x="886" y="666" font-size="34" font-weight="700" fill="#2563eb">at Side</text>

  <!-- C. Inseam, crotch point down the inner leg -->
  <line x1="470" y1="756" x2="470" y2="858" stroke="#2563eb" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="462" y1="756" x2="534" y2="750" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="196" y="800" font-size="34" font-weight="700" fill="#2563eb">C. Inseam</text>
  <line x1="404" y1="789" x2="462" y2="801" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- D. Half leg opening, flat across one leg hem -->
  <line x1="330" y1="916" x2="500" y2="916" stroke="#2563eb" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="329" y1="856" x2="329" y2="924" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="501" y1="864" x2="501" y2="924" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="286" y="968" font-size="34" font-weight="700" fill="#2563eb">D. ½ Leg Opening</text>

  <text x="540" y="1058" font-size="28" fill="#71717a" text-anchor="middle">Garment laid flat, unstretched. Measurements in centimetres.</text>
</svg>
