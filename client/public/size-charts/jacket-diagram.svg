<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- ================= garment ================= -->
  <g stroke="#3a3a3a" stroke-width="3" fill="#f8f8f8" stroke-linejoin="round" stroke-linecap="round">
    <!-- hood -->
    <path d="M375,175 C380,95 420,60 450,60 C480,60 520,95 525,175 C500,163 475,158 450,158 C425,158 400,163 375,175 Z"/>
    <!-- left sleeve -->
    <path d="M302,192 C260,220 205,330 178,455 L172,498 L238,516 L252,472 C270,410 284,350 291,300 Z"/>
    <!-- right sleeve -->
    <path d="M598,192 C640,220 695,330 722,455 L728,498 L662,516 L648,472 C630,410 616,350 609,300 Z"/>
    <!-- body -->
    <path d="M375,175 C400,163 425,158 450,158 C475,158 500,163 525,175 L598,192 C606,230 612,300 612,360 L612,560 L288,560 L288,360 C288,300 294,230 302,192 Z"/>
    <!-- cuffs -->
    <path d="M172,498 L238,516" fill="none"/>
    <path d="M728,498 L662,516" fill="none"/>
  </g>
  <!-- details: zip + collar + pockets + hem band -->
  <g stroke="#8a8a8a" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M450,170 L450,556"/>
    <path d="M375,175 C400,190 500,190 525,175"/>
    <path d="M320,470 L360,520"/>
    <path d="M580,470 L540,520"/>
    <path d="M288,540 L612,540"/>
  </g>

  <!-- ================= measurements ================= -->
  <g stroke="#2563eb" stroke-width="3" fill="none">
    <!-- A: half chest, armpit level -->
    <path d="M296,300 L604,300" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <!-- B: length HSP to hem -->
    <path d="M560,185 L560,556" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <!-- C: sleeve, neck to cuff -->
    <path d="M436,178 L212,492" marker-start="url(#ah)" marker-end="url(#ah)"/>
  </g>
  <g>
    <circle cx="352" cy="300" r="17" fill="#2563eb"/>
    <text x="352" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">A</text>
    <circle cx="560" cy="380" r="17" fill="#2563eb"/>
    <text x="560" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">B</text>
    <circle cx="300" cy="330" r="17" fill="#2563eb" transform="translate(24,26)"/>
    <text x="324" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">C</text>
  </g>

  <!-- ================= legend ================= -->
  <g font-size="20" fill="#333">
    <text x="450" y="640" text-anchor="middle" font-weight="700">JACKETS — ALL STYLES</text>
    <text x="450" y="672" text-anchor="middle" font-size="16" fill="#666">A. ½ Chest &#183; B. Length (HSP to hem) &#183; C. Sleeve (neck to cuff)</text>
    <text x="450" y="698" text-anchor="middle" font-size="14" fill="#999">Softshell &#183; Rugby Shell &#183; Windbreaker &#183; Quarter-Zip</text>
  </g>
</svg>
