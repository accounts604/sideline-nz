name: Customer queue (every 15 min)

# Drains the sideline-auto-queue Gmail label through Ezra. Idempotent —
# threads already labelled sideline-auto-handled are excluded by the
# default query, and Ezra applies the handled label after each thread.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry-run (no Ezra call, no label changes)"
        required: false
        default: "false"

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/process-customer-queue
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dryRun }}
        run: |
          set -e
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret not set"
            exit 1
          fi
          SITE="${SITE_URL:-https://sidelinenz.com}"
          QS=""
          if [ "$DRY_RUN" = "true" ]; then QS="?dryRun=true"; fi
          echo "Hitting $SITE/api/cron/process-customer-queue$QS"
          RESP=$(curl -sS -X POST "$SITE/api/cron/process-customer-queue$QS" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code}\n")
          echo "$RESP"
          echo "$RESP" | tail -1 | grep -q "HTTP 200" || exit 1
