name: Daily digest (07:30 NZ)

# 07:30 Pacific/Auckland = 19:30 UTC (NZST, UTC+12) or 18:30 UTC (NZDT, UTC+13).
# We run at 18:30 UTC so the user gets the digest by 07:30 NZ year-round —
# during DST it lands at 06:30 local, during standard time it lands at 07:30.
# (Acceptable drift; if precise local time matters later, split into two
#  schedules with calendar-bracketed cron expressions.)
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch: {} # lets you run it manually from the Actions tab

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/daily-digest
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret not set in this repo's settings"
            exit 1
          fi
          SITE="${SITE_URL:-https://sidelinenz.com}"
          echo "Hitting $SITE/api/cron/daily-digest"
          RESP=$(curl -sS -X POST "$SITE/api/cron/daily-digest" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code}\n")
          echo "$RESP"
          echo "$RESP" | tail -1 | grep -q "HTTP 200" || exit 1
